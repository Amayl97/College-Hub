<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="./../css/notes.css" />
    <!-- Font Awesome CDN -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>

  <body>
    <h2 class="heading">Get Your Notes</h2>

    <div class="container">
        <!-- Department Input -->
      <div class="dropdown">
        <div class="titleIcon">
            <p class="title">Choose Department</p>
            <i class="fa-solid fa-angle-down"></i>
        </div>

        <div class="options">
           <div class="inp">
            <input type="radio" name="department" value="it" id="it" />
            <label for="it">Information Technology</label>
          </div>

          <div class="inp">
            <input
              type="radio"
              name="department"
              value="english"
              id="english"
            />
            <label for="english">English</label>
          </div>

          <div class="inp">
            <input
              type="radio"
              name="department"
              value="polSci"
              id="polSci"
            />
            <label for="polSci">Political Science</label>
          </div>

          <div class="inp">
            <input
              type="radio"
              name="department"
              value="islamicSt"
              id="islamicSt"
            />
            <label for="islamicSt">Islamiyat</label>
          </div>
        </div>
      </div>

      
 <!-- Subject Input -->
       <div class="dropdown disabled" id="subjectDropdown">
        <div class="titleIcon">
            <p class="title">Choose Subject</p>
            <i class="fa-solid fa-angle-down"></i>
        </div>
        
        <div class="options" id="subjectOptions">
        </div>
      </div>
    </div>

    <div class="notesSection">
      <div class="outline"></div>
      <div class="notes"></div>
      <div class="slides"></div>
      <div class="labMaterial"></div>
    </div>

    <script src="./../js/notes.js"></script>
  </body>
</html>
